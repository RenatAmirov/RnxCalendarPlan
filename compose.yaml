services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=rnx_calendar;Username=rnx;Password=${POSTGRES_PASSWORD:-rnx_local_dev}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=1000"
      AllowedHosts: "localhost;127.0.0.1;[::1]"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "dotnet", "RnxCalendarPlan.Web.dll", "--health-check"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rnx_calendar
      POSTGRES_USER: rnx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rnx_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnx -d rnx_calendar"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-26379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  app_logs:
